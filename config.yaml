# Non-secret application configuration. Override any setting with an uppercase
# environment variable of the same name. Keep real credentials in `.env`.

app_environment: development
app_title: Crypto Trading System API
root_message: Crypto Trading System API
market_data_label: Binance Spot Live Market Data
app_host: 127.0.0.1
app_port: 8000
log_level: INFO
api_prefix: /api
# When true the backend also serves frontend/ at frontend_mount_path. Keep
# false to run the Vite frontend as a separate process (see start-frontend).
frontend_serving_enabled: false
frontend_mount_path: /dashboard
open_browser_on_start: false
browser_open_delay_seconds: 1
docs_url: /docs
redoc_url: /redoc
cors_origins: http://localhost:3000,http://127.0.0.1:3000,https://crypto-trading-system-psi.vercel.app
# Optional regex for additional trusted origins (e.g. Vercel previews). Keep the
# default only if preview deployments need API access; otherwise set it empty and
# list exact origins in cors_origins.
cors_origin_regex: "${CORS_ORIGIN_REGEX:-https://[A-Za-z0-9-]+\\.vercel\\.app}"
cors_allow_credentials: true
cors_allow_methods:
  - "*"
cors_allow_headers:
  - "*"

binance_api_key: ${BINANCE_API_KEY:-}
binance_api_secret: ${BINANCE_API_SECRET:-}
binance_testnet_rest_url: https://demo-api.binance.com
binance_market_rest_url: https://testnet.binance.vision
binance_market_ws_url: wss://stream.testnet.binance.vision/stream

trading_symbols: BTCUSDT,ETHUSDT
market_data_enabled: true
market_stream_suffix: "@trade"
order_book_stream_suffix: "@depth10@100ms"
order_book_depth_levels: 10
candle_history_size: 120
candle_history_bootstrap_limit: 120
candle_history_request_timeout_seconds: 10
candle_interval_name: 1m
candle_interval_seconds: 60
chart_intervals:
  - 1m
  - 5m
  - 15m
  - 1h
  - 4h
  - 1d
chart_history_limit: 300
websocket_open_timeout_seconds: 10
websocket_close_timeout_seconds: 10
websocket_ping_interval_seconds: 20
websocket_ping_timeout_seconds: 60
websocket_stale_timeout_seconds: 60
websocket_reconnect_initial_seconds: 1
websocket_reconnect_max_seconds: 60
websocket_reconnect_jitter_ratio: 0.2
websocket_control_interval_seconds: 0.25
websocket_max_streams: 1024
websocket_max_message_bytes: 1048576
websocket_max_queue: 256
frontend_tick_poll_seconds: 5
frontend_broadcast_interval_milliseconds: 100
order_book_render_interval_milliseconds: 500
# Reject risk-increasing BUY orders that consume more than this share of free quote balance.
max_order_balance_utilization_percent: 80
# Independent fat-finger ceiling for any risk-increasing order.
max_order_notional_usdt: 1000
# Reject new BUY orders when the latest streamed tick is older than this.
max_market_data_age_seconds: 5
max_open_positions_per_user: 10
max_price_deviation_percent: 5
max_concurrent_exchange_requests: 8
max_consecutive_order_failures: 5
order_circuit_breaker_cooldown_seconds: 30
reconciliation_interval_seconds: 5
# Base-asset quantity used by automatic SMA/EMA strategy MARKET entries.
strategy_order_quantity: 0.0001
order_request_timeout_seconds: 10
order_recv_window_milliseconds: 5000
exchange_info_cache_seconds: 3600
# SQLite file lives under the repository db/ folder for future development.
state_database_path: db/trading_state.db
# Supabase PostgreSQL is optional. Leave database_url empty to use the local
# SQLite file at state_database_path. To use Supabase, set DATABASE_URL (and
# DATABASE_PASSWORD) in the environment or a local .env file; never commit them.
database_url: ${DATABASE_URL:-}
database_password: ${DATABASE_PASSWORD:-}
fast_sma_period: 5
slow_ema_period: 10
strategy_signal_history_size: 200
strategy_indicator_history_size: 500
variant_a_stop_loss_percent: 10
variant_b_stop_loss_percent: 15
take_profit_percent: 5
order_execution_enabled: false
# Base64 Fernet key for encrypting stored user credentials. Generate one with:
#   python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
# When unset the backend generates and stores a key next to the database file.
credentials_master_key: ${CREDENTIALS_MASTER_KEY:-}
