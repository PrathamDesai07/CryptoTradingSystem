[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "db", "frontend"]

[tool.ruff.lint]
# Conservative, low-noise default set (pycodestyle E4/E7/E9 plus Pyflakes F).
# Broader rule families are deliberately left disabled so the codebase can be
# tightened in focused follow-ups instead of a single risky sweep.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["^\\.venv/", "^db/"]
