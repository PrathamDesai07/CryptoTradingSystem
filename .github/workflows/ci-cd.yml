name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover --start-directory tests --verbose

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate configuration and application import
        env:
          PYTHONPATH: backend
          MARKET_DATA_ENABLED: "false"
          STATE_DATABASE_PATH: /tmp/crypto-trading-ci.db
        run: python -c "from config import get_settings; from main import app; assert get_settings().app_port > 0; assert app is not None"

      - name: Build container
        run: docker build --tag crypto-trading-system:ci .

      - name: Smoke-test container
        shell: bash
        run: |
          docker run --detach --rm --name crypto-trading-ci \
            --publish 127.0.0.1:8000:8000 \
            --env MARKET_DATA_ENABLED=false \
            crypto-trading-system:ci
          trap 'docker stop crypto-trading-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs crypto-trading-ci
          exit 1

  publish:
    name: Publish production image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Trust production server
        run: ssh-keyscan -H 3.87.88.115 >> "$HOME/.ssh/known_hosts"

      - name: Copy application to production server
        run: |
          ssh ubuntu@3.87.88.115 'mkdir -p /opt/crypto-trading-system'
          rsync --archive --compress --delete \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude '.git/' \
            ./ ubuntu@3.87.88.115:/opt/crypto-trading-system/

      - name: Build and restart production container
        run: |
          ssh ubuntu@3.87.88.115 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /opt/crypto-trading-system
          test -f .env || { echo "Missing /opt/crypto-trading-system/.env on production server" >&2; exit 1; }
          docker build --tag crypto-trading-system:latest .
          docker rm --force crypto-trading-system 2>/dev/null || true
          docker run --detach \
            --name crypto-trading-system \
            --restart unless-stopped \
            --publish 8000:8000 \
            --env-file .env \
            --volume crypto-trading-data:/app/data \
            crypto-trading-system:latest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs crypto-trading-system
          exit 1
          REMOTE_SCRIPT
